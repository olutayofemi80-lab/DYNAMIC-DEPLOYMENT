services:
  mongo:
    image: mongo:7
    container_name: deployment-practice-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./backend
    container_name: deployment-practice-backend
    restart: unless-stopped
    environment:
      MONGO_URI: mongodb://mongo:27017/deployment_practice
      PORT: 3001
    ports:
      - "3001:3001"
    depends_on:
      - mongo

  frontend:
    build: ./frontend
    container_name: deployment-practice-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  mongo_data:
